<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DESLIGA Áudio</title>
<style>
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#0a202d,#102b3b);color:#f7f1e6;font-family:Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:30px 18px 60px} .brand{letter-spacing:6px;color:#e7b24c;font-weight:900;font-size:14px}
h1{font-size:36px;margin:8px 0 6px} .sub{color:#b8c9d2;line-height:1.55;margin-top:0}
.card{background:#153446;border:1px solid #355668;border-radius:22px;padding:20px;box-shadow:0 18px 45px rgba(0,0,0,.18)}
label{display:block;margin:18px 0 7px;font-weight:800} select,textarea,button{width:100%;font-size:16px;border-radius:13px;padding:13px}
select,textarea{background:#0d2838;color:white;border:1px solid #496777} textarea{min-height:330px;line-height:1.55;resize:vertical}
button{border:0;background:#e7b24c;color:#102635;font-weight:900;margin-top:17px;cursor:pointer} button:disabled{opacity:.55}
.status{color:#e7b24c;margin-top:13px;font-size:14px;white-space:pre-wrap} audio{width:100%;margin-top:18px} .small{font-size:12px;color:#8ea7b4;line-height:1.45}
</style></head>
<body><div class="wrap"><div class="brand">DESLIGA</div><h1>Gerador de Áudio</h1>
<p class="sub">Produção das faixas oficiais da Jornada DESLIGA com voz consistente via ElevenLabs.</p>
<div class="card">
<label>Faixa</label><select id="track"><option value='0'>01 — Cheguei esgotado</option>
<option value='1'>02 — Minha cabeça não desliga</option>
<option value='2'>03 — Transição trabalho-casa</option>
<option value='3'>04 — Hoje foi difícil</option>
<option value='4'>05 — Encerrando o dia</option></select>
<label>Roteiro</label><textarea id="text"></textarea>
<label>Voz ElevenLabs</label><select id="voice"><option>Carregando suas vozes...</option></select>
<button id="go">Gerar MP3</button><div class="status" id="status"></div>
<audio id="player" controls hidden></audio>
<a id="download" hidden><button>Salvar MP3</button></a>
<p class="small">A chave da ElevenLabs é lida somente pela função do servidor. Ela não é enviada ao navegador.</p>
</div></div>
<script>
const tracks=[{"title": "01 — Cheguei esgotado", "text": "Você chegou.\n\nTalvez tenha sido um daqueles dias em que parece que toda a sua energia ficou no trabalho.\n\nAntes de pensar no que ainda precisa fazer hoje, permita-se alguns minutos.\n\nVocê não precisa produzir nada enquanto ouve este áudio. Não precisa organizar sua vida. Não precisa encontrar motivação.\n\nPor alguns minutos, apenas reconheça: o expediente terminou.\n\nSe for confortável, deixe os ombros relaxarem. Respire naturalmente. Olhe ao seu redor e perceba onde você está agora.\n\nVocê não precisa esquecer o que aconteceu hoje. Mas também não precisa resolver novamente, dentro da sua cabeça, tudo aquilo que já aconteceu.\n\nSe existe alguma coisa que precisa ser resolvida amanhã, amanhã haverá um momento para isso.\n\nAgora existe este momento. E este momento também pertence à sua vida.\n\nEscolha uma coisa pequena para fazer depois daqui. Pode ser tomar banho, beber água, trocar de roupa, sentar alguns minutos ou simplesmente ficar em silêncio.\n\nNão escolha porque é produtivo. Escolha porque ajuda você a perceber: por hoje, eu terminei.\n\nO trabalho continua amanhã. Mas algumas horas da sua vida ainda existem hoje. E elas também merecem você."}, {"title": "02 — Minha cabeça não desliga", "text": "Talvez seu corpo já tenha saído do trabalho, mas sua cabeça ainda esteja lá.\n\nUma conversa volta. Uma tarefa reaparece. Uma preocupação tenta encontrar solução agora.\n\nVocê não precisa lutar contra cada pensamento. Apenas perceba quando ele chega e lembre a si mesmo: isso pode esperar pelo próximo momento adequado.\n\nRespire sem pressa. Observe três coisas ao seu redor. Sinta seus pés apoiados. Perceba que você está aqui, e não mais naquele momento do expediente.\n\nQuando um pensamento de trabalho voltar, experimente dizer mentalmente: eu anoto amanhã; agora eu volto para o presente.\n\nNão é preciso esvaziar a mente. A proposta é apenas diminuir o espaço que o trabalho ocupa nela nesta hora.\n\nSeu dia teve trabalho. Seu dia não precisa terminar sendo somente trabalho."}, {"title": "03 — Transição trabalho-casa", "text": "Este é um intervalo entre dois mundos.\n\nVocê está deixando para trás o papel que desempenhou durante o expediente e voltando, aos poucos, para a sua vida fora dele.\n\nPerceba o caminho. Os sons. A temperatura. O movimento ao seu redor.\n\nNão tente resolver o restante do dia inteiro agora. Escolha apenas como gostaria de chegar aos próximos minutos.\n\nTalvez mais silencioso. Talvez mais presente. Talvez apenas menos acelerado.\n\nImagine que cada trecho do caminho cria um pouco mais de distância entre você e as demandas que ficaram para amanhã.\n\nAo chegar, faça um pequeno gesto de transição: trocar de roupa, lavar o rosto, tomar água ou sentar por dois minutos.\n\nUm gesto simples pode dizer ao cérebro aquilo que o relógio nem sempre consegue dizer: o expediente acabou."}, {"title": "04 — Hoje foi difícil", "text": "Hoje foi difícil.\n\nTalvez alguma coisa tenha dado errado. Talvez você tenha ouvido algo que ficou ecoando. Talvez simplesmente tenha sido um dia longo demais.\n\nVocê não precisa transformar este momento em uma lição imediatamente.\n\nPrimeiro, reconheça o peso do dia sem aumentar esse peso com cobranças contra você mesmo.\n\nPergunte apenas: o que ainda depende de mim hoje, de verdade?\n\nSe a resposta for nada urgente, permita que o restante espere.\n\nFaça uma coisa que sinalize cuidado básico: água, comida, banho, silêncio, descanso ou contato com alguém importante.\n\nUm dia difícil não precisa receber também todas as horas que vêm depois dele.\n\nPor hoje, tente devolver ao trabalho aquilo que pertence ao trabalho e preservar um pequeno espaço que continue sendo seu."}, {"title": "05 — Encerrando o dia", "text": "O dia está terminando.\n\nTalvez nem tudo tenha sido resolvido. Quase nunca é.\n\nAntes de dormir, não faça um balanço de tudo que faltou. Perceba também aquilo que já terminou.\n\nSeu corpo atravessou mais um dia. Sua mente respondeu a muitas demandas. Agora ela pode receber menos estímulos.\n\nDiminua a luz, se puder. Afaste por alguns minutos aquilo que exige resposta imediata. Respire de forma confortável.\n\nNão precisamos fabricar uma noite perfeita. Precisamos apenas criar condições um pouco melhores para encerrar o dia.\n\nSe algo importante vier à cabeça, anote em poucas palavras e deixe para amanhã.\n\nAgora, permita que este dia termine sem continuar trabalhando dentro de você.\n\nO amanhã terá seu próprio tempo. Este momento é de encerramento."}];
const track=document.querySelector('#track'), text=document.querySelector('#text'), voice=document.querySelector('#voice');
const go=document.querySelector('#go'), status=document.querySelector('#status'), player=document.querySelector('#player'), download=document.querySelector('#download');
function setTrack(){text.value=tracks[Number(track.value)].text} track.onchange=setTrack; setTrack();
fetch('/api/voices').then(async r=>{const x=await r.json(); if(!r.ok) throw x; voice.innerHTML=''; (x.voices||[]).forEach(q=>{const o=document.createElement('option');o.value=q.voice_id;o.textContent=q.name;voice.appendChild(o)}); if(!voice.options.length) throw new Error('Nenhuma voz disponível.')}).catch(e=>{voice.innerHTML='<option>Não foi possível carregar</option>';status.textContent='Erro ao carregar vozes. Confira a variável ELEVENLABS_API_KEY.'});
go.onclick=async()=>{go.disabled=true;status.textContent='Gerando áudio...';player.hidden=true;download.hidden=true;try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.value,voiceId:voice.value})});if(!r.ok)throw new Error(await r.text());const b=await r.blob(),u=URL.createObjectURL(b);player.src=u;player.hidden=false;download.href=u;download.download=tracks[Number(track.value)].title.replace(/[^a-z0-9]+/gi,'-')+'.mp3';download.hidden=false;status.textContent='Áudio pronto para ouvir e salvar.'}catch(e){status.textContent='Erro na geração:\n'+e.message}finally{go.disabled=false}};
</script></body></html>
